[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "btsp-lab-audited"
version = "0.1.0"
description = "Audit-first modular CA3/CA1 rate-based BTSP and RL research framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]
[project.optional-dependencies]
tune = ["optuna>=3"]
test = ["pytest>=8", "numba>=0.59"]
[project.scripts]
btsp-run = "btsp_lab.experiments.runner:main"
[tool.setuptools]
packages = ["btsp_lab", "btsp_lab.models", "btsp_lab.learning", "btsp_lab.environments", "btsp_lab.analysis", "btsp_lab.experiments"]
package-dir = {btsp_lab = "src"}
[tool.pytest.ini_options]
testpaths = ["tests"]
